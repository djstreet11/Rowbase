name: Release
# Tag vX.Y.Z (or run manually) → one-file binaries for Linux/Windows/macOS + the native macOS DMG, attached to a GitHub release,
# plus the auto-update assets: Rowbase-<v>.zip, appcast.xml (Sparkle, EdDSA-signed) and SHA256SUMS — docs/UPDATES.md.
on:
  push: {tags: ["v*"]}
  workflow_dispatch:
jobs:
  onefile:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, linux: x64}
          - {os: ubuntu-24.04-arm, linux: arm64}
          - {os: windows-2022}          # binary runs on Windows 10 and 11
          - {os: macos-14}              # Apple Silicon
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Linux (Docker, glibc 2.31 → Ubuntu 20.04+)
        if: matrix.linux
        run: bash packaging/build-linux.sh ${{ matrix.linux }}
      - name: .deb (double-click install on Ubuntu/Debian, app-menu entry)
        if: matrix.linux
        run: |
          sudo chown -R "$USER" dist   # created by the Docker build as root
          bash packaging/make-deb.sh dist/rowbase-linux-${{ matrix.linux }} ${{ matrix.linux }}
          dpkg-deb -I dist/rowbase_*.deb
      - uses: actions/setup-python@v6
        if: ${{ !matrix.linux }}
        with: {python-version: "3.12"}
      - name: Windows / macOS
        if: ${{ !matrix.linux }}
        shell: bash
        run: |
          pip install . nuitka ordered-set zstandard
          python packaging/build.py
          ./dist/rowbase-* doctor
      - uses: actions/upload-artifact@v4
        with:
          name: "onefile-${{ matrix.os }}"
          path: |
            dist/rowbase-*
            dist/rowbase_*.deb
  dmg:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
        with: {fetch-depth: 0}
      - uses: maxim-lobanov/setup-xcode@v1
        with: {xcode-version: latest-stable}
      - uses: actions/setup-python@v6   # the DMG embeds the one-file CLI (MCP server)
        with: {python-version: "3.12"}
      - run: pip install . nuitka ordered-set zstandard && python packaging/build.py
      - run: bash native/scripts/release.sh
        env:   # optional: set these secrets/vars to ship a signed + notarized DMG (see docs/RELEASING.md)
          ROWBASE_SIGN_IDENTITY: ${{ vars.ROWBASE_SIGN_IDENTITY }}
          ROWBASE_NOTARY_PROFILE: ${{ vars.ROWBASE_NOTARY_PROFILE }}
      - name: Sparkle appcast (auto-update feed, docs/UPDATES.md) — skipped until secret SPARKLE_ED_PRIVATE_KEY exists
        if: startsWith(github.ref, 'refs/tags/')
        env:
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
          SPARKLE_VERSION: "2.10.0"   # tools only (sign_update); keep in sync with Sparkle in native/Package.swift
        run: |
          if [ -z "$SPARKLE_ED_PRIVATE_KEY" ]; then echo "::warning::SPARKLE_ED_PRIVATE_KEY not set — no appcast.xml in this release"; exit 0; fi
          V="$(cat native/VERSION)"; ZIP="native/dist/Rowbase-$V.zip"
          test "v$V" = "$GITHUB_REF_NAME"
          curl -fsSL "https://github.com/sparkle-project/Sparkle/releases/download/$SPARKLE_VERSION/Sparkle-$SPARKLE_VERSION.tar.xz" \
            | tar xJ -C "$RUNNER_TEMP" ./bin/sign_update
          SIG="$(printf '%s' "$SPARKLE_ED_PRIVATE_KEY" | "$RUNNER_TEMP/bin/sign_update" --ed-key-file - "$ZIP")"
          PREV="$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || true)"
          git log --no-merges --format=%s ${PREV:+$PREV..}HEAD > "$RUNNER_TEMP/notes.txt"
          # still the previous release while this one is being built → its items are carried over
          curl -fsSL -o "$RUNNER_TEMP/prev.xml" https://github.com/djstreet11/Rowbase/releases/latest/download/appcast.xml || true
          python packaging/appcast.py --version "$V" --build "$(git rev-list --count HEAD)" --archive "$ZIP" \
            --signature "$SIG" --notes "$RUNNER_TEMP/notes.txt" --previous "$RUNNER_TEMP/prev.xml" -o native/dist/appcast.xml
      - uses: actions/upload-artifact@v4
        with:
          name: dmg
          path: |
            native/dist/*.dmg
            native/dist/*.zip
            native/dist/appcast.xml
          if-no-files-found: warn
  pypi:   # Trusted Publishing (OIDC): PyPI → project rowbase-db → publisher djstreet11/Rowbase, workflow release.yml, env pypi
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    environment: pypi
    permissions: {id-token: write}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: {python-version: "3.12"}
      - name: Version must match the tag
        run: test "v$(python -c 'import tomllib;print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')" = "${GITHUB_REF_NAME}"
      - run: pip install build twine && python -m build && twine check dist/*
      - uses: pypa/gh-action-pypi-publish@release/v1
  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [onefile, dmg]
    runs-on: ubuntu-latest
    permissions: {contents: write}
    steps:
      - uses: actions/download-artifact@v4
        with: {path: out, merge-multiple: true}
      - name: Checksums (verified by `rowbase update`)
        run: cd out && sha256sum -- * > SHA256SUMS && cat SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with: {files: "out/*", generate_release_notes: true}

name: Release
# Tag vX.Y.Z (or run manually) → one-file binaries for Linux/Windows/macOS + the native macOS DMG, attached to a GitHub release.
on:
  push: {tags: ["v*"]}
  workflow_dispatch:
jobs:
  onefile:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, linux: x64}
          - {os: ubuntu-24.04-arm, linux: arm64}
          - {os: windows-2022}          # binary runs on Windows 10 and 11
          - {os: macos-14}              # Apple Silicon
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Linux (Docker, glibc 2.31 → Ubuntu 20.04+)
        if: matrix.linux
        run: bash packaging/build-linux.sh ${{ matrix.linux }}
      - uses: actions/setup-python@v6
        if: ${{ !matrix.linux }}
        with: {python-version: "3.12"}
      - name: Windows / macOS
        if: ${{ !matrix.linux }}
        shell: bash
        run: |
          pip install . nuitka ordered-set zstandard
          python packaging/build.py
          ./dist/rowbase-* doctor
      - uses: actions/upload-artifact@v4
        with: {name: "onefile-${{ matrix.os }}", path: "dist/rowbase-*"}
  dmg:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
        with: {fetch-depth: 0}
      - uses: maxim-lobanov/setup-xcode@v1
        with: {xcode-version: latest-stable}
      - uses: actions/setup-python@v6   # the DMG embeds the one-file CLI (MCP server)
        with: {python-version: "3.12"}
      - run: pip install . nuitka ordered-set zstandard && python packaging/build.py
      - run: bash native/scripts/release.sh
        env:   # optional: set these secrets/vars to ship a signed + notarized DMG (see docs/RELEASING.md)
          ROWBASE_SIGN_IDENTITY: ${{ vars.ROWBASE_SIGN_IDENTITY }}
          ROWBASE_NOTARY_PROFILE: ${{ vars.ROWBASE_NOTARY_PROFILE }}
      - uses: actions/upload-artifact@v4
        with: {name: dmg, path: "native/dist/*.dmg"}
  pypi:   # Trusted Publishing (OIDC): PyPI → project rowbase-db → publisher djstreet11/Rowbase, workflow release.yml, env pypi
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    environment: pypi
    permissions: {id-token: write}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: {python-version: "3.12"}
      - name: Version must match the tag
        run: test "v$(python -c 'import tomllib;print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')" = "${GITHUB_REF_NAME}"
      - run: pip install build twine && python -m build && twine check dist/*
      - uses: pypa/gh-action-pypi-publish@release/v1
  mcp-registry:   # official MCP Registry; ownership: io.github.djstreet11 via GitHub OIDC + mcp-name marker in the PyPI README
    needs: [pypi]
    runs-on: ubuntu-latest
    permissions: {id-token: write}
    steps:
      - uses: actions/checkout@v5
      - name: Install mcp-publisher
        run: curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher
      - run: ./mcp-publisher validate
      - run: ./mcp-publisher login github-oidc
      - run: ./mcp-publisher publish
  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [onefile, dmg]
    runs-on: ubuntu-latest
    permissions: {contents: write}
    steps:
      - uses: actions/download-artifact@v4
        with: {path: out, merge-multiple: true}
      - uses: softprops/action-gh-release@v2
        with: {files: "out/*", generate_release_notes: true}

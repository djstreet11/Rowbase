[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rowbase"
version = "0.1.0"
description = "Fast, safe, good-looking database client: CLI for agents + local web UI"
requires-python = ">=3.10"
dependencies = ["pymysql>=1.1", "psycopg[binary]>=3.1", "keyring>=24"]

[project.scripts]
rowbase = "rowbase.cli:main"

[tool.setuptools]
packages = ["rowbase"]

[tool.setuptools.package-data]
rowbase = ["static/*"]

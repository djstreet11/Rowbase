[build-system]
requires = ["setuptools>=77"]  # PEP 639 license expression
build-backend = "setuptools.build_meta"

[project]
# PyPI name: "rowbase" is taken by an unrelated project. Import package and command stay `rowbase`.
name = "rowbase-db"
version = "0.2.3"
description = "Fast, safe, read-only-by-default database client for MySQL/MariaDB, PostgreSQL and SQLite — CLI, web UI and MCP server for AI agents"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{name = "Rowbase contributors"}]
keywords = ["database", "database-client", "sql", "mysql", "mariadb", "postgresql", "sqlite", "mcp", "mcp-server",
            "model-context-protocol", "ai-agents", "claude", "cli", "web-ui"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Database",
    "Topic :: Database :: Front-Ends",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["pymysql>=1.1", "pg8000>=1.31", "keyring>=24"]  # all pure Python → one-file builds on any OS

[project.urls]
Homepage = "https://github.com/djstreet11/Rowbase"
Download = "https://github.com/djstreet11/Rowbase/releases/latest"
Documentation = "https://github.com/djstreet11/Rowbase/tree/main/docs"
Issues = "https://github.com/djstreet11/Rowbase/issues"
Changelog = "https://github.com/djstreet11/Rowbase/releases"

[project.scripts]
rowbase = "rowbase.cli:main"

[tool.setuptools]
packages = ["rowbase"]

[tool.setuptools.package-data]
rowbase = ["static/*"]
